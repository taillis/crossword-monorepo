<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="8" />

  <!-- 3x3 Crossword Shape with Intersecting Colored Cells -->
  <g filter="url(#glow)">
    <!-- (0,0) C -->
    <rect x="86" y="86" width="102" height="102" rx="20" fill="url(#primaryGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- (0,1) R -->
    <rect x="205" y="86" width="102" height="102" rx="20" fill="url(#primaryGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- (0,2) U -->
    <rect x="324" y="86" width="102" height="102" rx="20" fill="url(#primaryGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

    <!-- (1,1) O (Intersection) -->
    <rect x="205" y="205" width="102" height="102" rx="20" fill="url(#accentGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="3" />

    <!-- (2,0) Z -->
    <rect x="86" y="324" width="102" height="102" rx="20" fill="url(#goldGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- (2,1) S -->
    <rect x="205" y="324" width="102" height="102" rx="20" fill="url(#goldGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- (2,2) ! -->
    <rect x="324" y="324" width="102" height="102" rx="20" fill="url(#goldGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  </g>

  <!-- High-contrast crisp letters -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="58" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="137" y="140">C</text>
    <text x="256" y="140">R</text>
    <text x="375" y="140">U</text>

    <text x="256" y="259">Z</text>

    <text x="137" y="378">A</text>
    <text x="256" y="378">D</text>
    <text x="375" y="378">A</text>
  </g>
</svg>
