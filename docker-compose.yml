version: '3.8'

services:
  crossword:
    image: ghcr.io/taillis/crossword-monorepo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crossword-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
